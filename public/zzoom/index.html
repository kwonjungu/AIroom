<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>쭘 회의</title>
<link rel="icon" type="image/webp" href="/zzoom/assets/logo.webp">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<link rel="stylesheet" href="/zzoom/zzoom.css">
<script type="module" src="/zzoom/app.js"></script>
<script>
  // 학교망에서 첫 파일 받기가 끊기면 빈 화면이 된다. 15초 안에 app.js 가 시작하지 않으면 한 번 다시 읽는다(감사 R7 P5-M4).
  // 그래도 늦으면 닫을 수 있는 안내만 띄우고, 화면이 뜨면 안내를 스스로 지운다.
  setTimeout(function () {
    if (window.__zzBoot) return;
    var n = +(sessionStorage.getItem('zz_boot_retry') || 0);
    if (n < 1) { sessionStorage.setItem('zz_boot_retry', String(n + 1)); location.reload(); return; }
    var d = document.createElement('div');
    d.id = 'zz-boot-note';
    d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;padding:14px 48px 14px 16px;background:#fff;border:2px solid #c2410c;border-radius:12px;font-size:17px;z-index:9999';
    d.textContent = '인터넷이 느려 화면을 불러오는 중이에요. 계속 비어 있으면 새로 고침(F5)을 눌러 주세요.';
    var x = document.createElement('button');
    x.type = 'button'; x.textContent = '닫기'; x.setAttribute('aria-label', '안내 닫기');
    x.style.cssText = 'position:absolute;right:8px;top:8px;min-height:36px;padding:0 10px;font-size:15px';
    x.onclick = function () { d.remove(); };
    d.appendChild(x);
    document.body.appendChild(d);
    var t = setInterval(function () { if (window.__zzBoot) { clearInterval(t); d.remove(); } }, 500);
  }, 15000);
  window.addEventListener('load', function () { setTimeout(function () { if (window.__zzBoot) sessionStorage.removeItem('zz_boot_retry'); }, 3000); });
</script>
</head>
<!-- 자리 id 표는 docs/meeting-2026-11-25/CONTRACTS.md 4절. 팀은 자기 자리 안쪽만 바꾼다. -->
<body class="zz route-list">
<header id="zz-header">
  <a id="zz-brand" href="#/" aria-label="쭘 회의 목록">
    <img src="/zzoom/assets/logo.webp" alt="" width="32" height="32">
    <span>쭘 회의</span>
  </a>
  <h1 id="zz-meeting-title"></h1>
  <div id="zz-status" aria-live="polite"></div>
  <div id="zz-header-actions"></div>
  <button id="zz-agenda-toggle" class="zz-btn ghost" type="button" aria-controls="zz-agenda" aria-expanded="false">
    <span>쪽 목록</span>
  </button>
  <button id="zz-side-toggle" class="zz-btn ghost" type="button" hidden>
    <img class="zz-icon" src="/zzoom/assets/icon-chat.webp" alt=""><span>채팅과 투표</span><b class="zz-badge" aria-hidden="true"></b>
  </button>
</header>

<div id="zz-notice" role="status" hidden></div>

<section id="zz-gate" hidden>
  <div class="zz-card zz-gate-card">
    <img src="/zzoom/assets/hero-join.webp" alt="" width="320" height="320">
    <h2>백암이에서 먼저 로그인해 주세요</h2>
    <p>백암이에 로그인한 뒤 「회의진행 앱」 탭을 다시 눌러 주세요.</p>
    <a class="zz-btn primary" href="/">백암이로 가기</a>
  </div>
</section>

<main id="zz-list"></main>

<main id="zz-meeting" hidden>
  <aside id="zz-agenda" aria-label="안건 목록"></aside>
  <section id="zz-center">
    <div id="zz-follow-bar"></div>
    <div id="zz-stage">
      <canvas id="zz-layer-bg"></canvas>
      <canvas id="zz-layer-ink"></canvas>
      <canvas id="zz-layer-temp"></canvas>
      <div id="zz-stage-overlay"></div>
    </div>
    <div id="zz-toolbar"></div>
    <nav id="zz-pagebar" aria-label="쪽 넘기기">
      <div id="zz-board-actions"></div>
      <div id="zz-quick-hand"></div>
    </nav>
  </section>
  <aside id="zz-side" aria-label="채팅과 투표">
    <div id="zz-side-tabs" role="tablist"></div>
    <div id="zz-side-chat" class="zz-side-panel" role="tabpanel"></div>
    <div id="zz-side-poll" class="zz-side-panel" role="tabpanel" hidden></div>
    <div id="zz-side-hands" class="zz-side-panel" role="tabpanel" hidden></div>
    <div id="zz-side-log" class="zz-side-panel" role="tabpanel" hidden></div>
  </aside>
</main>

<footer id="zz-hostbar" aria-label="회의 담당자 막대">
  <div id="zz-hostbar-main"></div>
  <div id="zz-hostbar-upload"></div>
  <div id="zz-hostbar-board"></div>
  <div id="zz-hostbar-record"></div>
</footer>

<div id="zz-join" hidden></div>
<div id="zz-modal-root"></div>
<div id="zz-toast" aria-live="polite"></div>
</body>
</html>
